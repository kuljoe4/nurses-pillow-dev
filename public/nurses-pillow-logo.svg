<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Clip path for circular badge interior -->
    <clipPath id="circleBadgeClip">
      <circle cx="250" cy="250" r="236" />
    </clipPath>

    <!-- Lower arch text path for 'Rest Well. Heal Better.' -->
    <path id="subTextArch" d="M 100 375 A 205 205 0 0 0 400 375" fill="none" />

    <!-- Soft pillow drop shadow -->
    <filter id="pillowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0E2D58" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Badge Contents Group -->
  <g clip-path="url(#circleBadgeClip)">

    <!-- Crescent Moon & Stars in Night Sky -->
    <g fill="#0E2D58">
      <!-- Crescent Moon -->
      <path d="M 345 92 A 28 28 0 1 0 378 135 A 22 22 0 1 1 345 92 Z" />
      <!-- Star 1 (Top) -->
      <path d="M 326 80 Q 326 86 322 86 Q 326 86 326 92 Q 326 86 330 86 Q 326 86 326 80 Z" />
      <!-- Star 2 (Right) -->
      <path d="M 390 144 Q 390 149 386 149 Q 390 149 390 154 Q 390 149 394 149 Q 390 149 390 144 Z" />
    </g>

    <!-- Large White Fluffy Pillow -->
    <g filter="url(#pillowShadow)">
      <!-- Pillow Body -->
      <path
        d="M 175 305
           C 185 270, 205 240, 275 190
           C 320 155, 360 155, 410 175
           C 435 185, 442 210, 430 240
           C 408 290, 365 315, 305 325
           C 255 333, 200 328, 175 305 Z"
        fill="#FFFFFF"
        stroke="#0E2D58"
        stroke-width="5.5"
        stroke-linejoin="round"
      />
      <!-- Pillow Top Plump Crease -->
      <path
        d="M 285 185 C 330 160, 375 162, 408 178"
        fill="none"
        stroke="#0E2D58"
        stroke-width="3"
        stroke-linecap="round"
      />
      <!-- Pillow Shading Tone (Dimension) -->
      <path
        d="M 305 323 C 360 315, 405 285, 428 238 C 418 260, 385 295, 325 310 Z"
        fill="#E8F1FA"
      />
      <!-- Bottom right seam tuck -->
      <path
        d="M 395 245 C 385 260, 360 275, 340 282"
        fill="none"
        stroke="#CBDCEB"
        stroke-width="3"
        stroke-linecap="round"
      />
      <!-- Left indent where nurse's head sinks into the pillow -->
      <path
        d="M 205 272 C 220 285, 245 288, 275 280"
        fill="none"
        stroke="#CBDCEB"
        stroke-width="3"
        stroke-linecap="round"
      />

      <!-- Heart with Pulse Rhythm Insignia on Pillow -->
      <g transform="translate(335, 230)" stroke="#0E2D58" stroke-linecap="round" stroke-linejoin="round">
        <!-- Heart Outline -->
        <path
          d="M 0 -8
             C 0 -22, 24 -22, 24 -4
             C 24 10, 6 22, 0 28
             C -6 22, -24 10, -24 -4
             C -24 -22, 0 -22, 0 -8 Z"
          fill="none"
          stroke-width="4.5"
        />
        <!-- ECG Pulse Waveform -->
        <path
          d="M -28 10 L -12 10 L -7 4 L -2 20 L 5 -5 L 10 16 L 14 10 L 26 10"
          fill="none"
          stroke-width="4"
        />
      </g>
    </g>

    <!-- Sleeping Nurse Character -->
    <g>
      <!-- Navy Blue Scrubs Body / Torso -->
      <path
        d="M 95 255
           C 105 235, 128 220, 160 200
           C 185 185, 210 215, 215 245
           C 218 260, 205 280, 185 290
           C 140 295, 105 285, 95 255 Z"
        fill="#143666"
        stroke="#0E2D58"
        stroke-width="5"
        stroke-linejoin="round"
      />
      <!-- Scrubs Collar Accent -->
      <path
        d="M 160 200 C 168 215, 178 225, 192 230"
        fill="none"
        stroke="#244D87"
        stroke-width="3"
        stroke-linecap="round"
      />

      <!-- Nurse Left Arm and Sleeping Hand -->
      <!-- Arm Skin -->
      <path
        d="M 135 260
           C 140 290, 155 305, 180 300
           C 205 295, 225 275, 222 255
           C 205 258, 175 255, 135 260 Z"
        fill="#FDE4CE"
        stroke="#0E2D58"
        stroke-width="4.5"
        stroke-linejoin="round"
      />
      <!-- Hand curled on pillow -->
      <path
        d="M 190 270
           C 200 270, 215 265, 218 252
           C 218 245, 210 240, 200 245"
        fill="#FDE4CE"
        stroke="#0E2D58"
        stroke-width="3.5"
        stroke-linecap="round"
      />

      <!-- Nurse Head & Face -->
      <!-- Head / Cheek Shape -->
      <path
        d="M 165 170
           C 145 185, 142 215, 158 238
           C 178 265, 230 255, 252 225
           C 270 200, 260 160, 230 145
           C 195 130, 175 145, 165 170 Z"
        fill="#FDE4CE"
        stroke="#0E2D58"
        stroke-width="5"
        stroke-linejoin="round"
      />

      <!-- Cute Cheek Blush -->
      <ellipse cx="215" cy="210" rx="14" ry="7" fill="#F7A8A4" opacity="0.45" />

      <!-- Sleeping Eyes (Closed gently with lashes) -->
      <!-- Left Eye -->
      <path
        d="M 198 186 C 205 195, 220 195, 226 186"
        fill="none"
        stroke="#0E2D58"
        stroke-width="4.5"
        stroke-linecap="round"
      />
      <!-- Eyelashes Left -->
      <path d="M 222 189 L 228 193" stroke="#0E2D58" stroke-width="3" stroke-linecap="round" />
      <!-- Right Eye -->
      <path
        d="M 248 200 C 255 208, 265 206, 270 199"
        fill="none"
        stroke="#0E2D58"
        stroke-width="4"
        stroke-linecap="round"
      />

      <!-- Eyebrows (Peaceful curved) -->
      <path d="M 205 170 C 218 168, 232 173, 238 180" fill="none" stroke="#0E2D58" stroke-width="4" stroke-linecap="round" />
      <path d="M 258 182 C 265 184, 274 190, 277 195" fill="none" stroke="#0E2D58" stroke-width="3.5" stroke-linecap="round" />

      <!-- Cute Nose -->
      <path d="M 242 195 C 248 198, 250 205, 244 207" fill="none" stroke="#0E2D58" stroke-width="3.5" stroke-linecap="round" />

      <!-- Contented Sleeping Smile -->
      <path
        d="M 206 212 C 218 226, 234 225, 242 216"
        fill="none"
        stroke="#0E2D58"
        stroke-width="4.5"
        stroke-linecap="round"
      />

      <!-- Ear with inner curl -->
      <path
        d="M 166 182 C 158 180, 150 190, 156 202 C 160 208, 168 206, 170 200"
        fill="#FDE4CE"
        stroke="#0E2D58"
        stroke-width="4"
      />
      <path d="M 160 190 C 160 195, 164 198, 166 194" fill="none" stroke="#0E2D58" stroke-width="3" stroke-linecap="round" />

      <!-- Golden Blonde Hair -->
      <!-- Back hair volume -->
      <path
        d="M 160 160
           C 140 145, 135 115, 155 85
           C 178 55, 230 50, 265 72
           C 295 90, 310 130, 290 170
           C 275 160, 260 152, 240 148
           C 215 145, 185 148, 160 160 Z"
        fill="#F7CE5E"
        stroke="#0E2D58"
        stroke-width="5"
        stroke-linejoin="round"
      />
      <!-- Topknot Bun -->
      <ellipse
        cx="218"
        cy="75"
        rx="46"
        ry="36"
        fill="#F7CE5E"
        stroke="#0E2D58"
        stroke-width="5"
        transform="rotate(-8, 218, 75)"
      />
      <!-- Bun Swirl Details -->
      <path
        d="M 195 72 C 205 60, 232 58, 245 70 C 255 80, 245 95, 230 94 C 215 94, 212 85, 222 80"
        fill="none"
        stroke="#0E2D58"
        stroke-width="4"
        stroke-linecap="round"
      />
      <!-- Cute loose flyaway curl on bun -->
      <path d="M 165 92 C 155 88, 148 98, 160 106" fill="none" stroke="#0E2D58" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 280 102 C 295 106, 298 120, 286 128" fill="none" stroke="#0E2D58" stroke-width="3.5" stroke-linecap="round" />

      <!-- Hair Front Bangs / Fringe framing forehead -->
      <path
        d="M 172 165
           C 185 142, 210 132, 240 138
           C 265 142, 280 155, 282 172
           C 270 165, 255 162, 242 165
           C 225 170, 208 178, 195 188
           C 188 180, 180 170, 172 165 Z"
        fill="#F7CE5E"
        stroke="#0E2D58"
        stroke-width="4.5"
        stroke-linejoin="round"
      />
      <!-- Hair Strands Shading -->
      <path d="M 220 108 C 235 110, 255 120, 268 135" fill="none" stroke="#ECC148" stroke-width="4" stroke-linecap="round" />
      <path d="M 180 120 C 190 128, 205 132, 220 135" fill="none" stroke="#ECC148" stroke-width="3" stroke-linecap="round" />

      <!-- Stethoscope -->
      <!-- Stethoscope binaural around neck -->
      <path
        d="M 170 205
           C 165 220, 172 245, 185 260
           C 192 268, 202 268, 208 260"
        fill="none"
        stroke="#0E2D58"
        stroke-width="4.5"
        stroke-linecap="round"
      />
      <!-- Stethoscope Tube loop -->
      <path
        d="M 175 225
           C 160 240, 158 265, 170 278
           C 180 288, 195 285, 205 272"
        fill="none"
        stroke="#0E2D58"
        stroke-width="4.5"
        stroke-linecap="round"
      />
      <!-- Stethoscope Chest Piece / Bell -->
      <circle cx="212" cy="265" r="9" fill="#93B2D2" stroke="#0E2D58" stroke-width="3.5" />
      <circle cx="212" cy="265" r="4.5" fill="#FFFFFF" />
    </g>

    <!-- Lower Circular Typography Arc -->
    <!-- Curved '• Rest Well. Heal Better. •' Text -->
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="16" fill="#0E2D58" letter-spacing="2.5">
      <textPath href="#subTextArch" startOffset="50%" text-anchor="middle">
        &#8226; Rest Well. Heal Better. &#8226;
      </textPath>
    </text>

    <!-- 'Nurses' Main Flowing Script Brand Typography -->
    <g transform="translate(250, 368)">
      <!-- Main word: Nurses -->
      <text
        x="0"
        y="0"
        text-anchor="middle"
        font-family="'Kaushan Script', 'Brush Script MT', cursive"
        font-size="82"
        font-weight="bold"
        fill="#0E2D58"
        letter-spacing="0.5"
      >
        Nurses
      </text>

      <!-- Subtitle Row: — P I L L O W — -->
      <!-- Left line -->
      <line x1="-165" y1="20" x2="-80" y2="20" stroke="#0E2D58" stroke-width="3" stroke-linecap="round" />
      <!-- PILLOW tracked sans-serif text -->
      <text
        x="0"
        y="26"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', Arial, sans-serif"
        font-size="25"
        font-weight="800"
        letter-spacing="11"
        fill="#0E2D58"
      >
        PILLOW
      </text>
      <!-- Right line -->
      <line x1="80" y1="20" x2="165" y2="20" stroke="#0E2D58" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Solid Navy Outer Circle Border -->
  <circle cx="250" cy="250" r="240" fill="none" stroke="#0E2D58" stroke-width="14" />
</svg>
