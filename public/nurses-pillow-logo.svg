<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="npEmblemSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4FB" />
      <stop offset="100%" stop-color="#D5E8F8" />
    </linearGradient>

    <linearGradient id="npPillowGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1B8" />
      <stop offset="45%" stop-color="#F5D276" />
      <stop offset="100%" stop-color="#D4A12B" />
    </linearGradient>

    <linearGradient id="npNurseCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF4F8" />
    </linearGradient>

    <filter id="npSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#001848" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#npEmblemSky)" stroke="#005684" stroke-width="2.5" />
  <circle cx="80" cy="80" r="71" fill="none" stroke="#F1CF78" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Golden Fluffy Pillow -->
  <g filter="url(#npSoftShadow)">
    <path
      d="M 32 94 
         C 28 66, 44 52, 80 50 
         C 116 52, 132 66, 128 94 
         C 124 118, 108 126, 80 126 
         C 52 126, 36 118, 32 94 Z"
      fill="url(#npPillowGold)"
      stroke="#B8851B"
      stroke-width="1.6"
    />
    <!-- Pillow Tufts & Creases -->
    <path d="M 32 94 Q 44 91 54 90" stroke="#E5B94E" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 128 94 Q 116 91 106 90" stroke="#E5B94E" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 80 50 Q 80 58 80 62" stroke="#E5B94E" stroke-width="1.4" fill="none" stroke-linecap="round" />
    <path d="M 80 126 Q 80 118 80 114" stroke="#E5B94E" stroke-width="1.4" fill="none" stroke-linecap="round" />
    
    <!-- Center Indentation -->
    <ellipse cx="80" cy="94" rx="8" ry="4" fill="#C59322" opacity="0.4" />

    <!-- Resting Nurse's Cap -->
    <g transform="translate(80, 72)">
      <!-- Cap Main Shape -->
      <path
        d="M -28 6 
           C -28 -14, -20 -22, 0 -24 
           C 20 -24, 28 -14, 28 6 
           L 32 14 
           C 20 18, -20 18, -32 14 Z"
        fill="url(#npNurseCap)"
        stroke="#005684"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
      <!-- Cap Fold/Brim -->
      <path
        d="M -32 14 C -18 19, 18 19, 32 14 L 28 10 C 16 13, -16 13, -28 10 Z"
        fill="#D9E6F2"
        stroke="#005684"
        stroke-width="0.8"
      />
      <!-- Medical Cross on Nurse Cap -->
      <rect x="-3" y="-12" width="6" height="18" rx="1.2" fill="#0A6FA8" />
      <rect x="-9" y="-6" width="18" height="6" rx="1.2" fill="#0A6FA8" />
    </g>
  </g>

  <!-- Restful Golden Sparkles -->
  <path d="M 124 44 Q 127 44 127 41 Q 127 44 130 44 Q 127 44 127 47 Q 127 44 124 44 Z" fill="#F1CF78" />
  <path d="M 36 52 Q 38 52 38 50 Q 38 52 40 52 Q 38 52 38 54 Q 38 52 36 52 Z" fill="#F1CF78" />
</svg>
