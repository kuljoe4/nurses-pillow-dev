<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/nurses-pillow-logo.png" />
    <title>Nurses Pillow</title>
    <meta name="description" content="Sanctuary-grade travel nurse housing marketplace and clinical credentialing verification portal." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta property="og:title" content="Nurses Pillow" />
    <meta property="og:description" content="Sanctuary-grade travel nurse housing marketplace and clinical credentialing verification portal." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
    <style>
      /* 
       * Instant Ligature Flash Prevention:
       * Prevents raw ligature labels ("search", "check_circle", "bed", "close") 
       * from flashing as text before the Material Symbols font finishes downloading.
       */
      .material-symbols-outlined,
      .material-symbols-rounded,
      .material-symbols-sharp,
      .material-icons,
      [class*="material-symbols"] {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        font-feature-settings: 'liga';
        vertical-align: middle;
        user-select: none;
      }
      html:not(.fonts-loaded) .material-symbols-outlined,
      html:not(.fonts-loaded) .material-symbols-rounded,
      html:not(.fonts-loaded) .material-symbols-sharp,
      html:not(.fonts-loaded) .material-icons,
      html:not(.fonts-loaded) [class*="material-symbols"] {
        color: transparent !important;
        text-shadow: none !important;
        visibility: hidden !important;
        text-indent: -9999px !important;
        overflow: hidden !important;
        letter-spacing: -9999px !important;
        max-width: 0 !important;
        display: inline-block !important;
      }
      html.fonts-loaded .material-symbols-outlined,
      html.fonts-loaded .material-symbols-rounded,
      html.fonts-loaded .material-symbols-sharp,
      html.fonts-loaded .material-icons,
      html.fonts-loaded [class*="material-symbols"] {
        visibility: visible !important;
        color: inherit !important;
        text-indent: 0 !important;
        letter-spacing: normal !important;
        max-width: none !important;
        display: inline-flex !important;
      }
    </style>
    <script>
      (function() {
        if ('fonts' in document) {
          Promise.all([
            document.fonts.load('24px "Material Symbols Outlined"'),
            document.fonts.ready
          ]).then(function() {
            if (document.fonts.check('24px "Material Symbols Outlined"')) {
              document.documentElement.classList.add('fonts-loaded');
            } else {
              document.fonts.addEventListener('loadingdone', function() {
                if (document.fonts.check('24px "Material Symbols Outlined"')) {
                  document.documentElement.classList.add('fonts-loaded');
                }
              }, { once: true });
            }
          }).catch(function() {
            // Silently maintain protection if font fails
          });
        }
      })();
    </script>
  </head>
  <body class="bg-[#faf8ff] text-[#001848] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
