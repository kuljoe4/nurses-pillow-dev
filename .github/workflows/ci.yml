name: CI Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_OPTIONS: "--disable-warning=DEP0040"

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/testdb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Environment Details
        run: |
          echo "=== Debug Information ==="
          echo "Node version: $(node -v || true)"
          echo "NPM version: $(npm -v || true)"
          echo "NPM Cache Directory:"
          npm config get cache || true
          echo "NODE_OPTIONS: ${NODE_OPTIONS:-'Not set'}"
          echo "Directory Listing:"
          ls -la || true
          echo "Lock files present:"
          ls -la *lock* || true

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Post-Setup Diagnostic Dump
        if: steps.setup-node.outcome == 'failure'
        run: |
          echo "::error::setup-node failed! Dumping workspace to understand missing paths."
          echo "Full tree:"
          find . -maxdepth 2 -type f
          echo "git status:"
          git status
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Initialize Database
        run: npm run migrate

      - name: Run tests
        run: npm test
