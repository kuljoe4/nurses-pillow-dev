name: Push to Another Account

on:
  push:
    branches:
      - main  # Triggers when changes are pushed to your main branch

jobs:
  push-changes:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the source repository code
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      # Step 2: Make your modifications or build steps here
      - name: Make Changes (Example)
        run: |
          echo "Automated update from Source Repo" >> update-log.txt

      # Step 3: Configure Git, set the remote, and push using the PAT
      - name: Push to Destination Repo
        env:
          TARGET_PAT: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          # Configure dummy user info for the commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage and commit the changes
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update from source repository workflow"
            
            # Push to the remote using the token for authentication
            git push https://x-access-token:${TARGET_PAT}@github.com/NursesPillow/nurses-pillow-dev.git HEAD:main
          else
            echo "Working tree clean. Nothing to push."
          fi
